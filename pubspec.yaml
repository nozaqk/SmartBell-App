name: smartbell
description: SmartBell - one app for students and lecturers (timetable, bell and class notifications).
publish_to: "none"
version: 1.0.3+4

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  intl: ^0.19.0
  flutter_secure_storage: ^9.2.2
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true # replace @mipmap/ic_launcher
  ios: true
  min_sdk_android: 23
  image_path: assets/branding/app-icon.png
  image_path_android: assets/branding/app-icon-rounded.png
  adaptive_icon_background: "#016A63"
  adaptive_icon_foreground: assets/branding/bell-foreground.png
  adaptive_icon_monochrome: assets/branding/bell-foreground.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app-icon-rounded.png
