name: Publish Android APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (defaults to v<version from pubspec.yaml>, e.g. v1.0.0)"
        type: string
        required: false
      build_only:
        description: "Build without publishing (download the APK from this run instead)"
        type: boolean
        default: false

permissions:
  contents: write

# Don't race two uploads to the same release or changes to the Latest designation.
concurrency:
  group: ${{ inputs.build_only && github.run_id || 'android-release' }}
  cancel-in-progress: false

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Write build configuration (from repository secrets)
        env:
          API_URL: ${{ secrets.API_URL }}
          SCHOOL_SLUG: ${{ secrets.SCHOOL_SLUG }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_APP_ID_ANDROID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
        run: |
          {
            echo "API_URL=$API_URL"
            echo "SCHOOL_SLUG=$SCHOOL_SLUG"
            echo "FIREBASE_API_KEY=$FIREBASE_API_KEY"
            echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
            echo "FIREBASE_SENDER_ID=$FIREBASE_SENDER_ID"
            echo "FIREBASE_APP_ID_ANDROID=$FIREBASE_APP_ID_ANDROID"
            echo "FIREBASE_IOS_BUNDLE_ID=com.mozack.smartbell"
          } > firebase.env

      - name: Generate Android project and apply SmartBell settings
        run: ./tool/setup_platforms.sh

      - run: flutter pub get

      - name: Analyze (errors fail the build; style hints do not)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter test

      - name: Build universal release APK
        run: |
          flutter build apk --release --dart-define-from-file=firebase.env
          cp build/app/outputs/flutter-apk/app-release.apk build/latest.apk

      - name: Save build-only APK
        if: inputs.build_only
        uses: actions/upload-artifact@v4
        with:
          name: latest-apk
          path: build/latest.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish latest.apk to the Latest release
        if: ${{ !inputs.build_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: ./tool/publish_apk.sh "$RELEASE_TAG"
