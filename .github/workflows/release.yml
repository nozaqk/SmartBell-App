name: Build Android pre-release

# Runs when you push a version tag (git tag v1.0.0 && git push origin v1.0.0) or start it by hand from the Actions tab.
# Builds the release APK. A tag push or manual run with a tag also publishes a GitHub pre-release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Pre-release tag to publish (e.g. v1.0.0-pre); leave empty to verify the build only"
        type: string
        required: false

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Write build configuration (from repository secrets)
        env:
          API_URL: ${{ secrets.API_URL }}
          SCHOOL_SLUG: ${{ secrets.SCHOOL_SLUG }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
          FIREBASE_APP_ID_ANDROID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
        run: |
          {
            echo "API_URL=$API_URL"
            echo "SCHOOL_SLUG=$SCHOOL_SLUG"
            echo "FIREBASE_API_KEY=$FIREBASE_API_KEY"
            echo "FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
            echo "FIREBASE_SENDER_ID=$FIREBASE_SENDER_ID"
            echo "FIREBASE_APP_ID_ANDROID=$FIREBASE_APP_ID_ANDROID"
            echo "FIREBASE_IOS_BUNDLE_ID=com.mozack.smartbell"
          } > firebase.env

      - name: Generate Android project and apply SmartBell settings
        run: ./tool/setup_platforms.sh

      - run: flutter pub get

      - name: Analyze (errors fail the build; style hints do not)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter test

      - name: Build release APK
        run: flutter build apk --release --dart-define-from-file=firebase.env

      - name: Publish as pre-release
        if: github.event_name == 'push' || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION="$(grep -E '^version:' pubspec.yaml | head -1 | awk '{print $2}')"
          cp build/app/outputs/flutter-apk/app-release.apk "smartbell-${TAG}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "smartbell-${TAG}.apk" --clobber
          else
            gh release create "$TAG" "smartbell-${TAG}.apk" --prerelease --target "$GITHUB_SHA" \
              --title "SmartBell ${TAG} (pre-release)" \
              --notes "Pre-release build (app version ${VERSION}) for testing. Signed with the debug key, so not for the Play Store. Install on Android: allow installing unknown apps, then open the APK."
          fi
